name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Complete SHA already merged and green in default-branch CI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      tag: ${{ steps.eligibility.outputs.tag }}
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Set isolated uv cache on the runner
        run: |
          "UV_CACHE_DIR=$env:RUNNER_TEMP/nanobanana-release-cache" >> $env:GITHUB_ENV
      - name: Validate SHA syntax
        run: |
          if ($env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected complete SHA' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.9'
          python-version: '3.12.14'
          enable-cache: false
      - id: eligibility
        name: Exact commit CI and version eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python 3.12.14 python scripts/release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout eligible target only after trusted eligibility code passed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - name: Install and repeat required checks
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python scripts/check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release checksums and record
        run: |
          $Records = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $Hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $($_.Name)"
          }
          $Records | Set-Content -LiteralPath dist/SHA256SUMS -Encoding utf8NoBOM
          Copy-Item test-reports/release-eligibility.json dist/release-eligibility.json
          $Evidence = Get-Content test-reports/release-eligibility.json -Raw | ConvertFrom-Json
          @("Commit: $($Evidence.commit)", "CI: $($Evidence.ci_run)", '', 'Locked source installation and both stdio protocol checks passed. See release-eligibility.json and SHA256SUMS.') | Set-Content dist/RELEASE-NOTES.md -Encoding utf8NoBOM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: test-reports/
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_SHA: ${{ inputs.commit_sha }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: dist
      - name: Create immutable tag and draft release for final review
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$TARGET_SHA" >/dev/null
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/release-eligibility.json --draft --verify-tag --title "$RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md
