name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Set isolated uv cache on the runner
        run: |
          "UV_CACHE_DIR=$env:RUNNER_TEMP/nanobanana-uv-cache" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.9'
          python-version: '3.12.14'
          enable-cache: false
      - name: Locked development install
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Required checks
        run: |
          uv run --no-sync python scripts/check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ github.run_id }}
          path: test-reports/
          retention-days: 14
          if-no-files-found: error
